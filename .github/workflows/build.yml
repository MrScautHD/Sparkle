
name: Build Sparkle

on:
  release:
    types: [ "published" ]
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # Build Sparkle
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Build Sparkle
    - name: Build
      run: dotnet build --no-restore

    # Test
    - name: Test
      run: dotnet test --no-build --verbosity normal

  # Publish to NuGet
  publish-nuget:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    # Enable GitHub OIDC authentication
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Build and pack NuGet package
      - name: Pack NuGet package
        run: dotnet pack src/Sparkle -p:PackageVersion=${{ github.event.release.tag_name }} --configuration Release --output nuget

      # Authenticate with NuGet using OIDC
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: MrScautHD

      # Publish NuGet package
      - name: Publish NuGet package
        run: dotnet nuget push nuget/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
